name: Release

# master only ever receives release-ready commits, so a push to it is the
# release trigger. Everything else lands on develop.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Run the test suite
        run: npm test

      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Pushing master again without bumping must not fail the build, so every
      # step below is skipped when this version has already gone out.
      - name: Has this version been released?
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.v.outputs.version }} already exists — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Auth is the likeliest thing to be wrong, and it is the one failure that
      # must not happen after a tag has been pushed. Check it before mutating
      # anything, so a missing or expired NPM_TOKEN stops a clean run.
      - name: Check the npm credentials
        if: steps.check.outputs.released == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add a granular access token with"
            echo "::error::'Bypass 2FA' under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.released == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.released == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "csm v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      # Two assets, because there are two ways in when the npm registry is not
      # reachable. The .tgz installs with `npm i -g <file>`; the plain tarball
      # needs no npm at all, only tar and a symlink. Both are built from the
      # same `npm pack` output, so package.json's `files` stays the one place
      # that decides what ships.
      - name: Build the release assets
        if: steps.check.outputs.released == 'false'
        id: assets
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          npm pack --pack-destination dist
          tar -xzf "dist/claude-sessions-cli-$V.tgz" -C dist
          mv dist/package "dist/csm-$V"
          tar -czf "dist/csm-$V.tar.gz" -C dist "csm-$V"
          rm -rf "dist/csm-$V"
          ( cd dist && shasum -a 256 "claude-sessions-cli-$V.tgz" "csm-$V.tar.gz" > SHA256SUMS )
          cat dist/SHA256SUMS

      # The release page is the whole install path for anyone who cannot reach
      # the registry, so it carries the instructions rather than pointing at the
      # README for them. The notes live in .github/release-notes.md so they can
      # be read and reviewed as markdown instead of as shell quoting.
      - name: Write the install notes
        if: steps.check.outputs.released == 'false'
        run: |
          sed "s/__VERSION__/${{ steps.v.outputs.version }}/g" \
            .github/release-notes.md > dist/notes.md
          cat dist/notes.md

      - name: Create the GitHub Release
        if: steps.check.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" \
            --title "v$V" \
            --notes-file dist/notes.md \
            --generate-notes \
            "dist/claude-sessions-cli-$V.tgz" \
            "dist/csm-$V.tar.gz" \
            dist/SHA256SUMS
